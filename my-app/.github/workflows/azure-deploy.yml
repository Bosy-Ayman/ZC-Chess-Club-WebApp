name: Build and Deploy React App to Azure

on:
  push:
    branches:
      - main  # run this workflow on pushes to main branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Install dependencies in my-app
      - name: Install dependencies
        working-directory: my-app
        run: npm install

      # 3. Build React app
      - name: Build React app
        working-directory: my-app
        run: npm run build

      # 4. Deploy to Azure Web App
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: "zc-chess-club"               # your Azure app name
          slot-name: "production"
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}  # set this in GitHub secrets
          package: my-app/build                     # path to build folder
